version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dandoev_postgres
    restart: always
    environment:
      POSTGRES_USER: dandoev_user
      POSTGRES_PASSWORD: dandoev_password
      POSTGRES_DB: dandoev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: dandoev_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
